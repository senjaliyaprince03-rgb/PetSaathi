name: Production Deployment & Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_wYvWSP8fRz08ElCoe7lH7KIp' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_KpBoeUw7jhR9O8qwX5wlli87KEZU' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://petsaathi-two.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Validate deployment configuration
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN secret is not set in GitHub repository/environment secrets."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is not set."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is not set."
            exit 1
          fi
          case "$PRODUCTION_URL" in https://*) ;; *) echo "ERROR: PRODUCTION_URL must start with https://"; exit 1 ;; esac
      - name: Deploy production
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"
      - name: Require liveness and readiness
        run: |
          for endpoint in health ready; do
            curl --fail --show-error --silent --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$PRODUCTION_URL/api/$endpoint" > /dev/null
          done
