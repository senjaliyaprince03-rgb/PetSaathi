name: Production Deployment & Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://petsaathi-two.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Validate deployment configuration
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$PRODUCTION_URL"
          case "$PRODUCTION_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Deploy production
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"
      - name: Require liveness and readiness
        run: |
          for endpoint in health ready; do
            curl --fail --show-error --silent --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$PRODUCTION_URL/api/$endpoint" > /dev/null
          done
