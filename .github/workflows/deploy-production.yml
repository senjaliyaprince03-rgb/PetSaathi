name: Production Deployment & Verification

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Production Gate Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: |
          npm install
          npm install @rollup/rollup-linux-x64-gnu --no-save
      - name: Start disposable MongoDB Replica Set
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Prepare MongoDB test database & apply indexes
        run: |
          node scripts/init-test-db.js
          node scripts/apply-mongodb-indexes.js
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
          AUTH_SECRET: ci_auth_secret_123456789012345678901234567890
          NEXTAUTH_SECRET: ci_auth_secret_123456789012345678901234567890
          UPLOAD_SIGNING_SECRET: ci_upload_secret_1234567890123456789012345678

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit and Concurrency Tests
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
          AUTH_SECRET: ci_auth_secret_123456789012345678901234567890
          NEXTAUTH_SECRET: ci_auth_secret_123456789012345678901234567890

      - name: Teardown disposable MongoDB
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=critical

  deploy:
    name: Deploy to Vercel (Production)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set in GitHub repository settings. Skipping Vercel automated push."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - uses: amondnet/vercel-action@v25
        if: steps.check-creds.outputs.has_token == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

  healthcheck:
    name: Post-Deploy Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Query /api/health
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN not configured; skipping health check probe against external production domain."
            exit 0
          fi
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://petsaathi.com/api/health || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Production /api/health returned 200 OK"
              exit 0
            fi
            echo "Waiting for health check... ($STATUS)"
            sleep 10
          done
          echo "Health check failed after 5 retries"
          exit 1