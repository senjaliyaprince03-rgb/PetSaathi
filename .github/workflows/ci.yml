name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'
      - run: npm ci
      - name: Start disposable MongoDB
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Prepare MongoDB test database
        run: node scripts/init-test-db.js
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
          AUTH_SECRET: ci_auth_secret_123456789012345678901234567890
          UPLOAD_SIGNING_SECRET: ci_upload_secret_1234567890123456789012345678
      - run: npm run prisma:validate
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
          AUTH_SECRET: ci_auth_secret_123456789012345678901234567890
          UPLOAD_SIGNING_SECRET: ci_upload_secret_1234567890123456789012345678
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
          AUTH_SECRET: ci_auth_secret_123456789012345678901234567890
          UPLOAD_SIGNING_SECRET: ci_upload_secret_1234567890123456789012345678
          AUTH_DEV_FIXED_OTP: "123456"
      - name: Stop disposable MongoDB
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
          
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
          MONGODB_DATABASE: petsaathi_test
