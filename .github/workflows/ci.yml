name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_ci?replicaSet=rs0&directConnection=true
  MONGODB_DATABASE: petsaathi_ci
  AUTH_SECRET: ci-only-auth-secret-000000000000000000000000
  UPLOAD_SIGNING_SECRET: ci-only-upload-secret-0000000000000000000000
  NEXT_PUBLIC_APP_URL: https://ci.petsaathi.invalid
  NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_only
  RAZORPAY_KEY_SECRET: ci-only-razorpay-secret
  RAZORPAY_WEBHOOK_SECRET: ci-only-webhook-secret
  CRON_SECRET: ci-only-cron-secret-0000000000000000
  RESEND_API_KEY: ci-only-resend-key
  RESEND_FROM_EMAIL: ci@petsaathi.invalid
  WHATSAPP_ACCESS_TOKEN: ci-only-whatsapp-token

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ls --omit=dev --depth=0

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration:setup
      - run: npm run test:integration
      - if: always()
        run: npm run test:integration:teardown

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [quality, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration:setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: npm run test:integration:teardown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
