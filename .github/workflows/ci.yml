name: Required release validation
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONGODB_URI: mongodb://127.0.0.1:47017/petsaathi_test?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: petsaathi_test
      AUTH_SECRET: ci_only_auth_secret_123456789012345678901234567890
      NEXTAUTH_SECRET: ci_only_auth_secret_123456789012345678901234567890
      UPLOAD_SIGNING_SECRET: ci_only_upload_secret_123456789012345678901234567890
      AUTH_DEV_FIXED_OTP: '123456'
      NVIDIA_API_KEY: nvapi-ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=critical
      - run: npm run test:integration:setup
      - run: node scripts/verify-booking-indexes.mjs --apply-test
      - run: npm run test:integration
      - run: npm run test:concurrency
      - run: npm run build
      - run: node scripts/seed-all-credentials.mjs
        env:
          ALLOW_TEST_SEED: 'true'
          TEST_SEED_PASSWORD: 'CiOnlyStrongSeedPassword2026!'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/marketing.spec.ts --project=chromium --project=mobile
        env:
          PLAYWRIGHT_TEST: '1'
          TEST_SEED_PASSWORD: 'CiOnlyStrongSeedPassword2026!'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            playwright-report
            test-results
      - run: npm run test:integration:teardown
        if: always()
