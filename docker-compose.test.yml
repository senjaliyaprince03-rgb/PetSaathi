name: petsaathi-test

services:
  db-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: petsaathi_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: petsaathi_test
    ports:
      - "127.0.0.1:${PETSAATHI_TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petsaathi_test -d petsaathi_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
