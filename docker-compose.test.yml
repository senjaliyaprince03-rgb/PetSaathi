name: petsaathi-test

services:
  mongodb-test:
    image: mongo:8.0
    restart: "no"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${PETSAATHI_TEST_DB_PORT:-47017}:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
