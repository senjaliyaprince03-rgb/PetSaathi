<html lang="en-IN">

      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#18221b;background:#fffaf1}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:520px;border:1px solid rgba(24,34,27,.12);background:#fff;border-radius:36px;padding:42px;box-shadow:0 24px 70px rgba(35,39,31,.1)}.mark{display:grid;place-items:center;width:52px;height:52px;border-radius:18px;background:#f4b134;font-size:26px}h1{font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:28px 0 14px}p{line-height:1.7;color:rgba(24,34,27,.62)}button{margin-top:20px;border:0;border-radius:999px;background:#30275f;color:#fff;padding:14px 22px;font-weight:700;cursor:pointer}

  <body><main class="card"><div class="mark" aria-hidden="true">🐾</div><h1>You are temporarily offline.</h1><p>Public care guidance can be available offline after your first visit. Protected bookings, addresses, payments and pet-health details always require a secure connection.</p><button type="button" onclick="location.reload()">Try connection again</button></main></body>
