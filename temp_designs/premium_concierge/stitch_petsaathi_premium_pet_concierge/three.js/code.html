<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_14 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_14" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_14');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xd8a84e, 1.5); // Soft Gold
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Create a Luxury "Floating Paw" (Abstract Geometric representation)
const group = new THREE.Group();

// Central pad
const mainPadGeom = new THREE.SphereGeometry(0.8, 32, 32);
mainPadGeom.scale(1, 0.8, 0.3);
const material = new THREE.MeshPhongMaterial({ 
    color: 0x4a2e1f, // Luxury Brown
    shininess: 100,
    transparent: true,
    opacity: 0.9
});
const mainPad = new THREE.Mesh(mainPadGeom, material);
group.add(mainPad);

// Toes
const toeGeom = new THREE.SphereGeometry(0.3, 32, 32);
toeGeom.scale(1, 1.2, 0.5);
const toePositions = [
    [-0.7, 0.8, 0],
    [-0.2, 1.1, 0],
    [0.3, 1.1, 0],
    [0.8, 0.8, 0]
];

toePositions.forEach(pos => {
    const toe = new THREE.Mesh(toeGeom, material);
    toe.position.set(pos[0], pos[1], pos[2]);
    group.add(toe);
});

scene.add(group);
camera.position.z = 5;

// Animation
let mouseX = 0;
let mouseY = 0;

window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

function animate() {
    requestAnimationFrame(animate);
    
    // Floating motion
    group.position.y = Math.sin(Date.now() * 0.001) * 0.2;
    group.rotation.y += 0.005;
    
    // Mouse follow
    group.rotation.x += (mouseY * 0.5 - group.rotation.x) * 0.05;
    group.rotation.z += (mouseX * 0.5 - group.rotation.z) * 0.05;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_14 -->
</body>
</html>
